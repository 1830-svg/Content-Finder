<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Dashboard</title>
  <link rel="icon" type="image/png" href="https://img.freepik.com/free-photo/cloud-drawer_1048-1659.jpg?semt=ais_hybrid&w=740&q=80">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #4a90e2, #00c9a7, #d4f5fa, #f1f8e9);
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #222;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f5f7fa;
      color: #333;
      font-weight: 600;
    }

    tr:hover {
      background: #f9fcff;
    }

    .btn {
      margin-top: 20px;
      display: block;
      background: #00c9a7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4a90e2;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-bar button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .top-bar button:hover {
      background: #e63946;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>📊 Search Database</h1>
    <button onclick="clearDatabase()">Clear All</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name of Search Content</th>
        <th>Number of Searches</th>
        <th>Last Searched Date</th>
      </tr>
    </thead>
    <tbody id="dataTable"></tbody>
  </table>

  <button class="btn" onclick="goBack()">⬅ Back to Home</button>

  <script>
    function loadTable() {
      const logs = JSON.parse(localStorage.getItem("searchLogs") || "[]");
      const tbody = document.getElementById("dataTable");
      tbody.innerHTML = "";

      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No data found</td></tr>`;
        return;
      }

      logs.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.term}</td>
          <td>${item.count}</td>
          <td>${item.lastSearched}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function clearDatabase() {
      if (confirm("Are you sure you want to clear all search data?")) {
        localStorage.removeItem("searchLogs");
        loadTable();
      }
    }

    function goBack() {
      window.location.href = "index.html";
    }

    loadTable();
  </script>
</body>
</html>
