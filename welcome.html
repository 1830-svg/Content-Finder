<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Content Finder</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #4a90e2, #00c9a7, #d4f5fa, #f1f8e9);
      background-size: 300% 300%;
      animation: gradientFlow 8s ease infinite;
      color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      text-align: center;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
      animation: fadeInDown 1s ease;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      animation: fadeIn 2s ease;
      margin-bottom: 2rem;
      color: #083b5c;
      font-weight: 500;
    }

    .enter-btn {
      background: #ffffff;
      color: #007b83;
      border: none;
      border-radius: 50px;
      padding: 0.9rem 2.2rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      animation: fadeInUp 1.5s ease;
    }

    .enter-btn:hover {
      background: #e6f9f6;
      transform: scale(1.05);
      color: #006f70;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Welcome to Content Finder</h1>
  <p>Explore categories, discover ideas, and find what you love.</p>
  <button class="enter-btn" onclick="window.location.href='index.html'">Enter Website 🚀</button>
</body>
</html>
