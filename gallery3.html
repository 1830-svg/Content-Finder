<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery | Content Finder</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
  /* ====== Background Gradient (same as your theme) ====== */
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #4a90e2, #00c9a7, #d4f5fa, #f1f8e9);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    color: #333;
    overflow-x: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  
}

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ====== Page Title ====== */
  header {
    text-align: center;
    padding: 35px 20px;
    color: rgb(0, 0, 0);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    font-size: 2.2rem;
    letter-spacing: 1px;
    font-weight: 600;

}

  /* ====== Gallery Container (only 3 cards total) ====== */
  .gallery-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
    flex-wrap: wrap;
    padding: 40px;
    max-width: 1100px;
    margin: auto;
  }

  /* ====== Image Cards ====== */
  .photo-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    width: 300px;
    height: 280px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .photo-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  }

  .photo-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
  }

  .photo-card h3 {
    text-align: center;
    padding: 8px 0;
    font-size: 1.1rem;
    color: #333;
    font-weight: 500;
  }

  /* ====== Heading ====== */
  .heading {
    text-align: center;
    font-size: 2rem;
    color: #0f0e0e;
    font-weight: 600;
    margin-top: 50px;
  }
</style>

</head>

<body>
  <header>📸 Olympics</header>
  <div class="heading">
<h3></h3>
</div>
  <div class="gallery-container">
    <div class="photo-card">
      <img src="https://img.olympics.com/images/image/private/t_social_share_thumb/f_auto/primary/mmdfgqbwukdh3hmvs5rn" alt="Gallery Image 1" />
      <h3><b>Olympic logo </b></h3>
    </div>

    <div class="photo-card">
      <img src="https://s.abcnews.com/images/International/olympic-history-01-gty-jrl-180104_16x9_992.jpg" alt="Gallery Image 2" />
      <h3><b>Greek festivals in 776 BC to the modern</b></h3>
    </div>

    <div class="photo-card">
      <img src="https://images.immediate.co.uk/production/volatile/sites/7/2021/07/GettyImages-3203932-cfc63db.jpg?resize=768,521" alt="Gallery Image 3" />
      <h3><b>First modern international event started in 1896</b></h3>
    </div>
    </div>
    </div>
  </section>
</body>
</html>
